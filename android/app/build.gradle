plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

def getAppVersion() {
    def versionFile = file("../../VERSION")
    if (versionFile.exists()) {
        return versionFile.text.trim()
    }
    def pkgFile = file("../../package.json")
    if (pkgFile.exists()) {
        def parsedJson = new groovy.json.JsonSlurper().parseText(pkgFile.text)
        return parsedJson.version
    }
    return "3.9.1"
}

def getAppVersionCode() {
    def ver = getAppVersion()
    def digits = ver.replaceAll("[^0-9]", "")
    return digits.isInteger() ? digits.toInteger() : 391
}

android {
    namespace 'com.nexus.satellite'
    compileSdk 34

    defaultConfig {
        applicationId "com.nexus.satellite"
        minSdk 24
        targetSdk 34
        versionCode getAppVersionCode()
        versionName getAppVersion()
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging'
}
