name: Build and Release Nexus Satellite Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Android APK
        working-directory: ./android
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK Output
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/nexus-satellite.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-satellite-apk
          path: build-output/nexus-satellite.apk
          retention-days: 90

      - name: Update or Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v3.2.0
          name: "Nexus PC Command Center v3.2.0"
          body: |
            ### 🚀 Nexus PC Command Center & Satellite v3.2.0
            
            - **Native Android Satellite App:** Download `nexus-satellite.apk` directly to your phone.
            - **Native Windows GUI Wizard:** Download `nexus-pc-agent.zip` with `Setup.cmd`.
            - **Web Dashboard:** Access from anywhere at [https://nexus.hajimammad.com](https://nexus.hajimammad.com)
          files: |
            build-output/nexus-satellite.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
