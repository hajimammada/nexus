name: Build and Release Nexus Satellite Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Android APK
        working-directory: ./android
        run: |
          ./gradlew :app:assembleDebug --stacktrace --no-daemon > ../build.log 2>&1 || true
          echo "=== BUILD LOG (LAST 100 LINES) ==="
          tail -n 100 ../build.log
          if [ ! -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

      - name: Prepare APK Asset
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/nexus-satellite.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-satellite-apk
          path: build-output/nexus-satellite.apk
          retention-days: 90

      - name: Update or Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: v3.2.0
          name: "Nexus PC Command Center v3.2.0"
          body: |
            ### 🚀 Nexus PC Command Center & Satellite v3.2.0
            
            - **Native Android Satellite App:** Download `nexus-satellite.apk` below directly to your phone.
            - **Native Windows GUI Wizard:** Download `nexus-pc-agent.zip` with `Setup.cmd`.
            - **Web Dashboard:** Access from anywhere at [https://nexus.hajimammad.com](https://nexus.hajimammad.com)
          files: |
            build-output/nexus-satellite.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
